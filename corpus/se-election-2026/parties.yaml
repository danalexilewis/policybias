    label: C
    name: Centerpartiet
    colour: "#114838"
    logo: centerpartiet.svg
    anonymise:
      caseInsensitive:
        - Centerpartiet
        - Center Party
      caseSensitive:
        - "C's"
      uniqueTitle:
        - Centerpartiet
        - Center Party
      shortTitle: []

