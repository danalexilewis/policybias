# Display metadata for Swedish 2026 Riksdag parties.
#
# `label` is the short name on filter pills and category chips. Use the party
# name, not the ballot letter (C, M, S). `name` is the official name.
#
# Liberalerna is included as a sitting party contesting the election, even
# though August 2026 polling (Verian and Novus) puts it under the 4% threshold.
# No ninth party is close enough to add.

parties:
  - id: centerpartiet
    label: Centerpartiet
    name: Centerpartiet
    colour: "#114838"
    logo: centerpartiet.svg
    anonymise:
      caseInsensitive:
        - Centerpartiet
        - Center Party
      caseSensitive:
        - "C's"
      uniqueTitle:
        - Centerpartiet
        - Center Party
      shortTitle: []

  - id: kristdemokraterna
    label: Kristdemokraterna
    name: Kristdemokraterna
    colour: "#0B5EA1"
    logo: kristdemokraterna.svg
    anonymise:
      caseInsensitive:
        - Kristdemokraterna
        - Christian Democrats
      caseSensitive:
        - KD
      uniqueTitle:
        - Kristdemokraterna
        - Christian Democrats
      shortTitle:
        - KD

  - id: liberalerna
    label: Liberalerna
    name: Liberalerna
    colour: "#006AB3"
    logo: liberalerna.svg
    anonymise:
      caseInsensitive:
        - Liberalerna
        - The Liberals
      caseSensitive: []
      uniqueTitle:
        - Liberalerna
        - The Liberals
      shortTitle: []

  - id: miljopartiet
